server {
    listen 80;
    server_name localhost;

    # 해시 붙은 정적 자산은 장기 캐시 (파일명 hash가 바뀌면 자동으로 새로 받음)
    location ~* \.(?:js|mjs|css|woff2?|ttf|otf|png|jpg|jpeg|gif|svg|webp|ico|map)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # HTML / SPA 라우팅: 캐시 금지 — 새 배포가 사용자 브라우저에 즉시 반영되도록
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
